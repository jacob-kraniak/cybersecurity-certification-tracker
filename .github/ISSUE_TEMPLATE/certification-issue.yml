name: New Certification Entry
description: Add or update a certification with full details for consistent tracking
title: "[Certification] ACRONYM - Full Name (Code if applicable)"
labels: ["certification"]
assignees: ["jacob-kraniak"]

body:
  - type: markdown
    attributes:
      value: |
        # Certification Tracker Entry
        
        Keep all issues consistent for the [Cert Roadmap Board](https://github.com/users/jacob-kraniak/projects/3/views/4).
        
        **Important for Automation**: When a certification becomes Active or Certified, please add the direct Credly Badge URL below. This link is used by the README ribbon workflow for exact matching.

  - type: input
    id: status
    attributes:
      label: Status
      description: Backlog / In Progress / Studying / Completed / Certified / Active
      placeholder: Backlog
    validations:
      required: true

  - type: input
    id: date_certified
    attributes:
      label: Date Certified (if applicable)
      placeholder: 2026-05-07 or May 2026

  - type: input
    id: credly_badge_url
    attributes:
      label: Credly Badge URL (Direct Link) - Required for Active/Certified
      description: Paste the full public URL of the specific badge (e.g. https://www.credly.com/badges/1fc6fa72-65b5-4d96-bf02-88a27b0e71e2)
      placeholder: https://www.credly.com/badges/...
    validations:
      required: false

  - type: input
    id: credly_badge_id
    attributes:
      label: Credly Badge ID (Optional but recommended for automation)
      description: The UUID portion from the Credly URL above (used for exact matching)
      placeholder: 1fc6fa72-65b5-4d96-bf02-88a27b0e71e2

  - type: input
    id: target_date
    attributes:
      label: Target Completion
      placeholder: 2026-12 or Q4 2026

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
      default: 1
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Brief description, target roles, value.
    validations:
      required: true

  - type: input
    id: official_link
    attributes:
      label: Official Page
      placeholder: https://...

  - type: input
    id: exam_outline
    attributes:
      label: Exam Outline / Syllabus
      placeholder: https://...

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites / Experience
      placeholder: e.g., Prior cert + X years...

  - type: textarea
    id: exam_details
    attributes:
      label: Exam Details
      description: Include the fields you use
      placeholder: |
        - Duration: X hours
        - Questions: XXX (Multiple Choice / Performance-based / etc.)
        - Price: ~$XXX USD
        - Passing Score: XXX / 1000 or XX%
        - Format: Pearson VUE / etc.
    validations:
      required: true

  - type: textarea
    id: domains
    attributes:
      label: Domains & Study Checklist
      description: Weights + checkboxes for progress
      placeholder: |
        - [ ] Domain 1: Name (XX%)
          - Key topics...
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources & Study Plan
      placeholder: |
        - Official training
        - Books / practice tests
        - Cost notes

  - type: textarea
    id: milestones
    attributes:
      label: Milestones / Tasks
      placeholder: |
        - [ ] Domain study & notes
        - [ ] Practice exams (target 80%+)
        - [ ] Schedule exam
        - [ ] Pass & update Credly / board
        - [ ] Post-cert actions (CEUs, resume, etc.)

  - type: input
    id: extra_labels
    attributes:
      label: Additional Labels (comma separated)
      placeholder: isc2, advanced, management, analyst

  - type: markdown
    attributes:
      value: |
        **Project Board Tip**: After creation, drag to the correct column and populate custom fields (Status, Target Date, Priority, Cost if you have one, etc.).
        
        The Credly Badge URL and ID fields above are now used by automation to keep the README ribbon in sync.
